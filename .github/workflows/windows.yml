name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Prepare media test tools
        run: ./Install-MediaEngine.ps1
      - name: Test and build
        run: ./Build.ps1
      - name: Assemble the portable core
        run: |
          New-Item -ItemType Directory -Path dist/Petal/assets -Force | Out-Null
          Copy-Item Petal.exe, README.md, FORMATS.md, LICENSE, THIRD_PARTY_NOTICES.md, Install-MediaEngine.ps1 dist/Petal/
          Copy-Item assets/petal.png, assets/BENCHO-LICENSE.txt dist/Petal/assets/
      - name: Upload Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Petal-Windows-x64
          path: dist/Petal/
          if-no-files-found: error
          retention-days: 14
