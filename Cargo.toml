[package]
name = "petal"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A native Windows radial menu for one-click file conversion."
license = "MIT"
repository = "https://github.com/Syawi/Petal"
readme = "README.md"

[dependencies]
tiff = "=0.11.3"
flate2 = "=1.1.10"
lopdf = { version = "=0.46.0", default-features = false }
ttf-parser = "=0.25.1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
roxmltree = "=0.20.0"
tl = "=0.7.8"
html-escape = "=0.2.13"
pulldown-cmark = { version = "=0.13.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
windows = { version = "0.58", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_System_WinRT", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Accessibility", "Win32_System_SystemServices"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_Media_Audio", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Controls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
